services:
  proxy:
    image: nginx:1.31-alpine
    ports:
      - "0.0.0.0:443:443"
    restart: always
    volumes:
      - /usr/local/etc/nginx-proxy/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /usr/local/etc/nginx-proxy/certs:/etc/nginx/certs:ro

  drachenwald:
    image: ghcr.io/drachenwald/drachenwald:main
    pull_policy: always
    restart: always
  
  staging:
    image: ghcr.io/drachenwald/drachenwald:staging
    pull_policy: always
    restart: always

  ceremonies:
    image: ghcr.io/drachenwald/ceremonies:main
    pull_policy: always
    restart: always

  forms:
    image: ghcr.io/drachenwald/forms:main
    pull_policy: always
    restart: always

  scripts:
    image: ghcr.io/drachenwald/dw-scripts:main
    pull_policy: always
    restart: always

