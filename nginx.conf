user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    #    include /etc/nginx/conf.d/*.conf;

    ssl_certificate	/etc/nginx/certs/public/cf-origin.crt;
    ssl_certificate_key /etc/nginx/certs/private/cf-origin.key;
    ssl_verify_client   on;
    ssl_client_certificate /etc/nginx/certs/public/cf-origin-pull.crt;

    server {
        listen       443 ssl;
        listen  [::]:443 ssl;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

    server {
        listen       443 ssl;
        listen  [::]:443 ssl;
        server_name  drachenwald.org;

        location / {
            proxy_pass http://drachenwald:80;
        }
    }

    server {
        listen       443 ssl;
        listen  [::]:443 ssl;
        server_name  www.drachenwald.org;
	    return 301 https://drachenwald.org$request_uri;
    }

    server {
        listen       443 ssl;
        listen  [::]:443 ssl;
        server_name  ceremonies.drachenwald.org;

        location / {
            proxy_pass http://ceremonies:80;
        }
    }

    server {
        listen       443 ssl;
        listen  [::]:443 ssl;
        server_name  www.ceremonies.drachenwald.org;
	    return 301 https://ceremonies.drachenwald.org$request_uri;
    }

}
