services:
  proxy:
    image: nginx:1.31-alpine
    ports:
      - "0.0.0.0:443:443"
      - "[::]:443:443"
    volumes:
      - /usr/local/etc/nginx-proxy/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /usr/local/etc/nginx-proxy/certs:/etc/nginx/certs:ro
    networks:
      - ipv6-network
      - default

  drachenwald:
    image: ghcr.io/drachenwald/drachenwald:main

networks:
  ipv6-network:
    enable_ipv6: true

